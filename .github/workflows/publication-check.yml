name: Source and build checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check tracked files and source-only fixture generators
        run: |
          python3 scripts/publication_audit.py --summary
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  macos-arm64:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          path: modernization
          persist-credentials: false
      - name: Build and test without game assets
        run: |
          test "$(uname -m)" = arm64
          python3 modernization/scripts/setup.py --ci

  windows-core-x64:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          path: modernization
          persist-credentials: false
      - name: Build and test source-only x64 client core
        working-directory: modernization
        run: python scripts/setup_windows.py --core

  windows-renderer-x64:
    needs: windows-core-x64
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          path: modernization
          persist-credentials: false
      - name: Install pinned x64 Vulkan SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.4.321.1'
          $installer = Join-Path $env:RUNNER_TEMP 'vulkan-sdk.exe'
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe" -OutFile $installer
          $expected = 'baaa4f7ca11ed3d82aa1c102b21208915485bbaa473068c763daa425cca468bd'
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Vulkan SDK checksum mismatch'
          }
          $sdk = Join-Path $env:RUNNER_TEMP 'VulkanSDK'
          $process = Start-Process -FilePath $installer -WindowStyle Hidden -Wait -PassThru -ArgumentList @('--root', $sdk, '--accept-licenses', '--default-answer', '--confirm-command', 'install')
          if ($process.ExitCode -ne 0) { throw "Vulkan SDK installer failed: $($process.ExitCode)" }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "$sdk\Bin" >> $env:GITHUB_PATH
      - name: Build client and renderer; run source and Win32 window smoke tests
        working-directory: modernization
        run: python scripts/setup_windows.py
